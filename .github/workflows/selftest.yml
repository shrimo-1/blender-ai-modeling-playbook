name: Self Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run self tests
        run: python tools/selftest.py
        env:
          # Windows runners default Python stdio to the system code page (cp1252),
          # which cannot encode the Chinese labels printed by selftest.py
          # (UnicodeEncodeError on all windows-latest jobs, run 35302132521).
          PYTHONUTF8: "1"
